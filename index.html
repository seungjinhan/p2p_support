<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0f172a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>P2P Direct Share - WebRTC DataChannel (9B Header)</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="brand">
            <div class="brand-icon">⚡</div>
            <div class="brand-title">P2P Direct Share</div>
        </div>
        <div class="status-bar">
            <div id="pingBadge" class="ping-badge" style="display: none;">⚡ -- ms</div>
            <div id="statusBadge" class="status-badge">
                <span class="status-dot"></span>
                <span id="statusText">연결 준비 중...</span>
            </div>
        </div>
    </header>

    <main>
        <!-- Sidebar: Connection & QR Code -->
        <aside class="connection-panel">
            <div class="card">
                <div class="card-title">
                    <span>기기 연결</span>
                    <span id="peerStatusLabel" style="font-size: 0.8rem; color: var(--text-muted);">1:1 P2P (E2EE)</span>
                </div>

                <div class="room-info">
                    <div class="room-label">Room Code</div>
                    <div id="roomCodeDisplay" class="room-code">------</div>
                </div>

                <div class="qr-container">
                    <div id="qrContainer" style="display: flex; justify-content: center; align-items: center;"></div>
                </div>

                <div class="btn-group">
                    <button id="btnCopyLink" class="btn-primary">
                        📋 초대 링크 복사
                    </button>
                    <div class="join-box">
                        <input type="text" id="joinRoomInput" class="join-input" placeholder="방 코드 6자리" maxlength="6">
                        <button id="btnJoinRoom" class="btn-secondary">입장</button>
                    </div>
                </div>

                <div class="device-badge">
                    <span>💻</span>
                    <span id="myDeviceInfo">내 기기 감지 중...</span>
                </div>
            </div>
        </aside>

        <!-- Main Content: File Transfer & Chat -->
        <section class="content-panel">
            <!-- File Transfer Card -->
            <div class="card">
                <div class="card-title">
                    <span>대용량 파일 고속 전송 (9B Binary Header)</span>
                    <span style="font-size: 0.8rem; color: var(--accent);">서버 경유 0% • 무제한 용량</span>
                </div>

                <!-- Dropzone Area -->
                <div id="dropZone" class="dropzone">
                    <div class="dropzone-icon">📁</div>
                    <div class="dropzone-title">파일을 여기에 드래그하거나 터치하여 선택</div>
                    <div class="dropzone-sub">기기 간 P2P 직접 전송 • 초고속 32KB 청크 스트리밍 • E2EE 암호화</div>
                    <input type="file" id="fileInput" multiple style="display: none;">
                </div>

                <!-- Active Transfers List -->
                <div id="transferList" class="transfer-list"></div>
            </div>

            <!-- Chat & Clipboard Card -->
            <div class="card chat-card">
                <div class="card-title">
                    <span>실시간 메시지 & 클립보드</span>
                    <button id="btnSendClipboard" class="btn-secondary" style="font-size: 0.75rem; padding: 4px 10px;">
                        📋 클립보드 즉시 전송
                    </button>
                </div>

                <div id="chatMessages" class="chat-messages">
                    <div class="message-bubble incoming" style="background: rgba(51, 65, 85, 0.4); color: var(--text-muted); font-size: 0.85rem;">
                        상대방 기기가 연결되면 메시지와 파일을 즉시 주고받을 수 있습니다.
                    </div>
                </div>

                <form id="chatForm" class="chat-input-bar">
                    <input type="text" id="chatInput" class="chat-input" placeholder="메시지를 입력하세요..." autocomplete="off">
                    <button type="submit" id="btnSendChat" class="btn-primary">전송</button>
                </form>
            </div>
        </section>
    </main>

    <!-- Dependencies & Scripts -->
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <script src="qr.min.js"></script>
    <script src="protocol.js"></script>
    <script src="app.js"></script>
</body>
</html>
